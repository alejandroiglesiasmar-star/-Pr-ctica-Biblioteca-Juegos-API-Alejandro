info:
  name: Buscar por título
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:8080/api/videojuegos?titulo=mario
  params:
    - name: titulo
      value: mario
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
